[package]
name = "mudhut"
version = "0.3.7"
edition = "2021"
description = "The easy way to install Adobe apps into Neutron prefixes"
license = "Apache-2.0"
repository = "https://github.com/Nico-LaFoucate/Mud-Hut"

[[bin]]
name = "mudhut"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
anyhow = "1"
# HTTP client for the remote ledger (1.2) and the Adobe download pipeline (1.3).
# rustls (pure-Rust TLS) — no system OpenSSL dep, portable across distros.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# Read-only XML for the Adobe product feed (buildGuid lookup). Pure-Rust, no deps.
roxmltree = "0.20"
# Download-integrity segment hashing. TYPE2 validation is SHA-256 (the big product
# payloads); TYPE1 (small shared deps) is MD5 — both via RustCrypto's DynDigest.
sha2 = "0.10"
md-5 = "0.10"
# PR_SET_PDEATHSIG only: tie the installer host's lifetime to ours so killing
# Mud Hut can never leave a decrypt running against a half-installed prefix.
libc = "0.2"
# Adobe's own install record, caps/hdpim.db, read-only (`immutable=1`). `bundled` compiles SQLite
# in, so no system libsqlite is needed on any distro.
rusqlite = { version = "0.40", features = ["bundled"] }
# The verified-builds list is signed (minisign / Ed25519); the public key is compiled in.
minisign-verify = "0.3"
# The cached product feed is stored gzip-compressed (14 MB of XML -> ~0.4 MB).
flate2 = "1"

[profile.release]
strip = true
lto = true
